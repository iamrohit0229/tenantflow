server:
  port: 8080

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka

spring:
  cloud:
    gateway:
      routes:
        - id: tenant-service
          uri: lb://tenant-service
          predicates:
            - Path=/api/tenants/**

        - id: identity-service
          uri: lb://identity-service
          predicates:
            - Path=/api/auth/**

        - id: billing-service
          uri: lb://billing-service
          predicates:
            - Path=/api/billing/**

        - id: audit-service
          uri: lb://audit-service
          predicates:
            - Path=/api/audit/**

management:
  endpoints:
    web:
      exposure:
        include: gateway,health,info
