apiVersion: apps/v1
kind: Deployment
metadata:
  name: audit-service
  namespace: tenantflow
spec:
  replicas: 1
  selector:
    matchLabels:
      app: audit-service
  template:
    metadata:
      labels:
        app: audit-service
    spec:
      containers:
        - name: audit-service
          image: tenantflow/audit-service:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 8084
          env:
            - name: SPRING_CONFIG_IMPORT
              value: optional:configserver:http://config-server:8888
            - name: EUREKA_CLIENT_SERVICEURL_DEFAULTZONE
              value: http://eureka-server:8761/eureka
            - name: SPRING_DATA_MONGODB_URI
              value: mongodb://mongodb:27017/tenantflow_audit
          readinessProbe:
            tcpSocket:
              port: 8084
            initialDelaySeconds: 40
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: audit-service
  namespace: tenantflow
spec:
  selector:
    app: audit-service
  ports:
    - port: 8084
      targetPort: 8084
